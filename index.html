<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التعاويذ الصوتية السحرية - هافلباف</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap');

        body {
            background-color: #0d1117;
            color: #d4af37;
            font-family: 'Amiri', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 1s ease, filter 2s ease, transform 2s ease, box-shadow 0.5s ease;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden; 
            perspective: 1000px;
        }

        /* 1. Lumos */
        body.lumos-active {
            background-color: #ffffff !important;
            color: #000000;
            box-shadow: inset 0 0 50px #fff9c4;
        }

        /* 2. Petrificus Totalus */
        body.frozen {
            pointer-events: none !important;
            user-select: none;
            filter: grayscale(100%) contrast(150%) brightness(80%);
        }

        /* 3. Incendio */
        body.incendio-active {
            background: radial-gradient(circle at bottom, #2b0500 0%, #0d1117 60%);
        }
        #fire-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        .flame-particle {
            position: absolute;
            bottom: -50px;
            border-radius: 50%;
            filter: blur(8px);
            mix-blend-mode: screen;
            animation: rise linear forwards;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1) translateX(0); opacity: 1; }
            100% { transform: translateY(-80vh) scale(0.4) translateX(var(--sway)); opacity: 0; }
        }

        /* 4. Aguamenti */
        #water-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0;
            background: rgba(28, 163, 236, 0.7);
            z-index: 10;
            pointer-events: none;
            transition: height 2s ease-in-out, opacity 1.5s ease-in-out;
            box-shadow: inset 0 20px 50px rgba(255, 255, 255, 0.4);
            border-top: 5px solid rgba(255, 255, 255, 0.5);
            opacity: 1;
        }
        body.aguamenti-active #water-container {
            height: 100vh;
        }

        /* 5. Confundo */
        body.confundo-active {
            animation: confundo-spin 8s ease-in-out infinite alternate;
            filter: hue-rotate(180deg) blur(1px);
        }
        @keyframes confundo-spin {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(15deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(0.8); }
            75% { transform: rotate(165deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* 6. Wingardium Leviosa */
        body.leviosa-active .levitate-target {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(3deg); }
        }

        /* 7. Obliviate */
        #obliviate-fog {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(230,230,230,0.9) 100%);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
        }
        body.obliviate-active #obliviate-fog {
            opacity: 1;
        }

        /* 8. Bombarda (كسر الشاشة) */
        .shake-intense {
            animation: bombarda-shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes bombarda-shake {
            10%, 90% { transform: translate3d(-10px, 10px, 0) rotate(-2deg); }
            20%, 80% { transform: translate3d(10px, -10px, 0) rotate(2deg); }
            30%, 50%, 70% { transform: translate3d(-15px, 15px, 0) rotate(-4deg); }
            40%, 60% { transform: translate3d(15px, -15px, 0) rotate(4deg); }
        }
        #glass-crack-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9998; /* تحت الضباب بقليل */
            display: none;
            opacity: 0.85;
        }

        /* 9. Reparo (الإصلاح) */
        body.reparo-active {
            animation: flash-gold 1s ease-out;
        }
        @keyframes flash-gold {
            0% { box-shadow: inset 0 0 0px #d4af37; }
            50% { box-shadow: inset 0 0 150px #d4af37; }
            100% { box-shadow: inset 0 0 0px #d4af37; }
        }

        /* 10. Engorgio / Reducio (التحكم في الحجم) */
        #main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(1); /* الحجم الافتراضي (الوسط) */
            z-index: 20;
        }
        #main-content.text-large {
            transform: scale(1.4); /* حجم كبير */
        }
        #main-content.text-small {
            transform: scale(0.65); /* حجم صغير */
        }

        /* العناصر الأساسية */
        h1 {
            font-size: 3em;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            margin-bottom: 10px;
        }
        #status {
            font-size: 1.5em;
            margin: 10px 0 30px 0;
            height: 30px;
            font-family: 'Cairo', sans-serif;
        }
        #mic-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: #d4af37;
            border: 2px solid #d4af37;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-size: 3em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }
        #mic-btn:hover {
            background-color: #d4af37;
            color: #0d1117;
            box-shadow: 0 0 20px #d4af37;
        }
        #mic-btn.listening {
            animation: pulse 1.5s infinite;
            background-color: #ae0001;
            color: white;
            border-color: #ae0001;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(174, 0, 1, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(174, 0, 1, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(174, 0, 1, 0); }
        }
        #spell-result {
            margin-top: 30px;
            font-size: 2.5em;
            font-weight: bold;
            text-transform: capitalize;
            direction: ltr;
            letter-spacing: 2px;
            color: #ecb939;
        }

        /* نافذة الباتروناس */
        #patronus-container {
            display: none;
            margin-top: 30px;
            background: rgba(20, 20, 20, 0.9);
            padding: 25px;
            border: 2px solid #ecb939;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(236, 185, 57, 0.2);
            font-family: 'Cairo', sans-serif;
            max-width: 400px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #patronus-container p { font-size: 1.2em; margin-bottom: 20px; line-height: 1.5; }
        #patronus-input {
            width: 80%; padding: 10px; font-size: 1.2em; border: 1px solid #d4af37;
            border-radius: 5px; background: #111; color: #fff; text-align: center; margin-bottom: 15px;
        }
        #call-btn {
            background-color: #2a623d; color: white; border: none; padding: 10px 20px;
            font-size: 1.2em; border-radius: 5px; cursor: pointer; transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- حاويات التأثيرات البصرية -->
    <div id="fire-container"></div>
    <div id="water-container"></div>
    <div id="obliviate-fog"></div>
    
    <!-- تأثير الزجاج المهشم (Bombarda) -->
    <div id="glass-crack-container">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%; height:100%;">
            <!-- شروخ عشوائية تبدو كالزجاج المكسور -->
            <path d="M50,50 L0,0 M50,50 L100,0 M50,50 L100,100 M50,50 L0,100 
                     M50,50 L20,0 M50,50 L80,0 M50,50 L100,20 M50,50 L100,80 
                     M50,50 L80,100 M50,50 L20,100 M50,50 L0,80 M50,50 L0,20" 
                  stroke="rgba(255,255,255,0.8)" stroke-width="0.3" fill="none"/>
            <path d="M48,48 L52,48 L52,52 L48,52 Z" fill="rgba(255,255,255,0.9)"/>
            <path d="M20,20 L30,10 L40,25 M80,20 L70,10 L60,25 
                     M80,80 L70,90 L60,75 M20,80 L30,90 L40,75
                     M10,50 L20,40 L30,50 M90,50 L80,60 L70,50" 
                  stroke="rgba(255,255,255,0.6)" stroke-width="0.15" fill="none"/>
        </svg>
    </div>

    <!-- المحتوى الرئيسي (يتم تطبيق التكبير والتصغير والطيران عليه) -->
    <div id="main-content" class="levitate-target">
        <h1>عصاك السحرية جاهزة</h1>
        <div id="status">اضغط على الزر وانطق التعويذة</div>
        
        <button id="mic-btn">🎙️</button>

        <div id="spell-result"></div>

        <!-- نافذة استدعاء الباتروناس -->
        <div id="patronus-container">
            <p>اختار مين اكتر حد بتتبسط لما تكلمه (الباترونس بتاعك يعني) 🦌✨</p>
            <input type="tel" id="patronus-input" placeholder="رقم الهاتف..." autocomplete="off">
            <br>
            <button id="call-btn" onclick="callPatronus()">استدعاء</button>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status');
        const resultText = document.getElementById('spell-result');
        const patronusContainer = document.getElementById('patronus-container');
        const mainContent = document.getElementById('main-content');
        const body = document.body;
        
        let cameraTrack = null;
        let fireInterval = null;
        let isFireActive = false;
        let fireTimeout = null;
        let leviosaTimeout = null;
        let confundoTimeout = null;

        // قائمة التعاويذ المتاحة
        const validSpells = [
            "lumos",
            "nox",
            "aguamenti",
            "incendio",
            "expecto patronum",
            "petrificus totalus",
            "avada kedavra",
            "confundo",
            "wingardium leviosa",
            "obliviate",
            "bombarda",
            "reparo",
            "engorgio",
            "reducio"
        ];

        function getSimilarity(s1, s2) {
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) != s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function findClosestSpell(spokenText) {
            let bestMatch = spokenText;
            let lowestDistance = Infinity;
            for (let spell of validSpells) {
                if (spokenText.includes(spell)) return spell;
                if (spokenText.includes("leviosa") && spell === "wingardium leviosa") return spell;

                let distance = getSimilarity(spokenText, spell);
                if (distance < lowestDistance) {
                    lowestDistance = distance;
                    bestMatch = spell;
                }
            }
            return (lowestDistance <= 6) ? bestMatch : spokenText;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "عذراً، متصفحك لا يدعم التعرف على الصوت.";
            micBtn.style.display = 'none';
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; 
            recognition.interimResults = false;
            
            micBtn.addEventListener('click', () => {
                patronusContainer.style.display = "none"; 
                recognition.start();
                micBtn.classList.add('listening');
                statusText.innerText = "جارِ الاستماع للتعويذة...";
                resultText.innerText = "";
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                const correctedSpell = findClosestSpell(transcript);
                
                if (transcript !== correctedSpell && validSpells.includes(correctedSpell)) {
                    resultText.innerHTML = `<span style="color:#888; font-size:0.6em; text-decoration:line-through;">${transcript}</span> <br> ✨ ${correctedSpell}`;
                } else {
                    resultText.innerText = transcript;
                }
                executeSpell(correctedSpell);
            };

            recognition.onspeechend = () => {
                recognition.stop();
                micBtn.classList.remove('listening');
                if(statusText.innerText === "جارِ الاستماع للتعويذة...") {
                    statusText.innerText = "اضغط على الزر وانطق التعويذة";
                }
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                statusText.innerText = "لم أتمكن من السماع، حاول مجدداً.";
            };
        }

        function startFire() {
            if (isFireActive) return;
            isFireActive = true;
            body.classList.add('incendio-active');
            const container = document.getElementById('fire-container');
            
            fireInterval = setInterval(() => {
                const flame = document.createElement('div');
                flame.classList.add('flame-particle');
                const size = Math.random() * 80 + 40; 
                const left = Math.random() * 100;
                const duration = Math.random() * 2 + 1.5; 
                const sway = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 100); 
                
                const colors = [
                    "radial-gradient(circle, rgba(255,200,0,1) 0%, rgba(255,80,0,0.8) 40%, rgba(255,0,0,0) 70%)",
                    "radial-gradient(circle, rgba(255,140,0,1) 0%, rgba(200,20,0,0.8) 50%, rgba(255,0,0,0) 70%)"
                ];

                flame.style.width = `${size}px`;
                flame.style.height = `${size}px`;
                flame.style.left = `${left}%`;
                flame.style.animationDuration = `${duration}s`;
                flame.style.setProperty('--sway', `${sway}px`);
                flame.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                container.appendChild(flame);
                setTimeout(() => { flame.remove(); }, duration * 1000);
            }, 60); 
        }

        function stopFire() {
            if (!isFireActive) return;
            isFireActive = false;
            clearInterval(fireInterval);
            body.classList.remove('incendio-active');
        }

        async function executeSpell(spell) {
            
            // 1. Lumos
            if (spell === "lumos") {
                statusText.innerText = "✨ جارِ تشغيل النور...";
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    cameraTrack = stream.getVideoTracks()[0];
                    const capabilities = cameraTrack.getCapabilities();
                    if (capabilities.torch) {
                        await cameraTrack.applyConstraints({ advanced: [{ torch: true }] });
                        statusText.innerText = "✨ Lumos Maxima!";
                    } else { throw new Error("لا يدعم الفلاش"); }
                } catch (error) {
                    body.classList.add('lumos-active');
                    statusText.innerText = "✨ Lumos! (كشاف الشاشة)";
                }
            } 
            
            // 2. Nox
            else if (spell === "nox") {
                if (cameraTrack) { cameraTrack.stop(); cameraTrack = null; }
                body.classList.remove('lumos-active');
                statusText.innerText = "🌑 Nox!";
            }
            
            // 3. Incendio
            else if (spell === "incendio") {
                statusText.innerText = "🔥 Incendio! (نار تشتعل)";
                startFire();
                clearTimeout(fireTimeout);
                fireTimeout = setTimeout(() => {
                    stopFire();
                    if(statusText.innerText.includes("Incendio")) statusText.innerText = "✨ انطفأت النار!";
                }, 8000);
            }

            // 4. Aguamenti
            else if (spell === "aguamenti") {
                const water = document.getElementById('water-container');
                water.style.opacity = "1";
                body.classList.add('aguamenti-active');
                if (isFireActive) {
                    stopFire();
                    clearTimeout(fireTimeout);
                    statusText.innerText = "💧 Aguamenti! (المياه تطفئ النار)";
                } else {
                    statusText.innerText = "💧 Aguamenti! (المياه تملأ المكان)";
                }
                setTimeout(() => {
                    body.classList.remove('aguamenti-active');
                    statusText.innerText = "✨ انحسرت المياه!";
                    setTimeout(() => { water.style.opacity = "0"; }, 2000);
                }, 5000); 
            }
            
            // 5. Confundo
            else if (spell === "confundo") {
                statusText.innerText = "🌀 Confundo! (تشوش تام)";
                body.classList.add('confundo-active');
                clearTimeout(confundoTimeout);
                confundoTimeout = setTimeout(() => {
                    body.classList.remove('confundo-active');
                    if(statusText.innerText.includes("Confundo")) statusText.innerText = "✨ زال تأثير التشوش!";
                }, 8000);
            }

            // 6. Wingardium Leviosa
            else if (spell === "wingardium leviosa") {
                statusText.innerText = "🪶 Wingardium Leviosa! (تحليق)";
                body.classList.add('leviosa-active');
                clearTimeout(leviosaTimeout);
                leviosaTimeout = setTimeout(() => {
                    body.classList.remove('leviosa-active');
                    if(statusText.innerText.includes("Leviosa")) statusText.innerText = "✨ انتهى التحليق!";
                }, 10000);
            }

            // 7. Bombarda (تحطيم الزجاج)
            else if (spell === "bombarda") {
                statusText.innerText = "💥 Bombarda! (تهشيم الشاشة)";
                document.getElementById('glass-crack-container').style.display = 'block';
                body.classList.add('shake-intense');
                setTimeout(() => {
                    body.classList.remove('shake-intense');
                }, 400);
            }

            // 8. Reparo (إصلاح الزجاج)
            else if (spell === "reparo") {
                statusText.innerText = "✨ Reparo! (إصلاح الشاشة)";
                document.getElementById('glass-crack-container').style.display = 'none';
                body.classList.add('reparo-active');
                setTimeout(() => {
                    body.classList.remove('reparo-active');
                }, 1000);
            }

            // 9. Engorgio (تكبير)
            else if (spell === "engorgio") {
                if (mainContent.classList.contains('text-small')) {
                    mainContent.classList.remove('text-small');
                    statusText.innerText = "🔍 Engorgio! (عاد الحجم للوسط)";
                } else if (!mainContent.classList.contains('text-large')) {
                    mainContent.classList.add('text-large');
                    statusText.innerText = "🔍 Engorgio! (تكبير الحجم)";
                } else {
                    statusText.innerText = "🔍 Engorgio! (هذا أقصى حجم ممكن)";
                }
            }

            // 10. Reducio (تصغير)
            else if (spell === "reducio") {
                if (mainContent.classList.contains('text-large')) {
                    mainContent.classList.remove('text-large');
                    statusText.innerText = "🔎 Reducio! (عاد الحجم للوسط)";
                } else if (!mainContent.classList.contains('text-small')) {
                    mainContent.classList.add('text-small');
                    statusText.innerText = "🔎 Reducio! (تصغير الحجم)";
                } else {
                    statusText.innerText = "🔎 Reducio! (هذا أصغر حجم ممكن)";
                }
            }
            
            // 11. Obliviate (إعادة ضبط شاملة)
            else if (spell === "obliviate") {
                statusText.innerText = "🌫️ Obliviate! (مسح الذاكرة وإعادة الضبط)";
                body.classList.add('obliviate-active');
                
                setTimeout(() => {
                    if (cameraTrack) { cameraTrack.stop(); cameraTrack = null; }
                    stopFire();
                    body.className = ''; 
                    mainContent.className = 'levitate-target'; // إعادة الحجم لطبيعته
                    document.getElementById('glass-crack-container').style.display = 'none'; // إصلاح الزجاج
                    patronusContainer.style.display = "none";
                    resultText.innerText = "";
                    statusText.innerText = "اضغط على الزر وانطق التعويذة";
                }, 1500); 

                setTimeout(() => { body.classList.remove('obliviate-active'); }, 3000);
            }

            // 12. Expecto Patronum
            else if (spell === "expecto patronum") {
                statusText.innerText = "🦌 جارِ استدعاء الباتروناس...";
                patronusContainer.style.display = "block"; 
                document.getElementById('patronus-input').focus();
            }
            
            // 13. Petrificus Totalus
            else if (spell === "petrificus totalus") {
                statusText.innerText = "❄️ Petrificus Totalus! (متجمدة 10 ثواني)";
                body.classList.add('frozen');
                setTimeout(() => {
                    body.classList.remove('frozen');
                    if(statusText.innerText.includes("Petrificus")) {
                        statusText.innerText = "✨ تم فك التعويذة!";
                        resultText.innerText = "";
                    }
                }, 10000);
            }
            
            // 14. Avada Kedavra
            else if (spell === "avada kedavra") {
                statusText.innerText = "☠️ تعويذة محظورة!";
                setTimeout(() => {
                    body.innerHTML = "<h1 style='color:#ae0001; font-size:4em; margin-top:20vh;'>GAME OVER</h1>";
                }, 1500);
            }
            
            else {
                statusText.innerText = "تعويذة غير معروفة أو لم أتعرف عليها جيداً.";
            }
        }

        function callPatronus() {
            const phoneNumber = document.getElementById('patronus-input').value.trim();
            if (phoneNumber !== "") {
                window.location.href = `tel:${phoneNumber}`;
            } else {
                alert("يرجى كتابة رقم الهاتف أولاً!");
            }
        }
    </script>
</body>
</html>
