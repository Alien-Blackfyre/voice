<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التعاويذ الصوتية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');

        body {
            background-color: #0d1117;
            color: #d4af37;
            font-family: 'Amiri', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 1s ease, color 1s ease;
            text-align: center;
        }

        /* فئة إضاءة اللوموس */
        body.lumos-active {
            background-color: #ffffff;
            color: #000000;
            box-shadow: inset 0 0 50px #fff9c4;
        }

        h1 {
            font-size: 3em;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        #status {
            font-size: 1.5em;
            margin: 20px 0;
            height: 30px;
        }

        #mic-btn {
            background-color: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-size: 3em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mic-btn:hover {
            background-color: #d4af37;
            color: #0d1117;
            box-shadow: 0 0 20px #d4af37;
        }

        #mic-btn.listening {
            animation: pulse 1.5s infinite;
            background-color: #ae0001;
            color: white;
            border-color: #ae0001;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(174, 0, 1, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(174, 0, 1, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(174, 0, 1, 0); }
        }

        #spell-result {
            margin-top: 30px;
            font-size: 2em;
            font-weight: bold;
            text-transform: capitalize;
            direction: ltr;
        }
    </style>
</head>
<body>

    <h1>عصاك السحرية جاهزة</h1>
    <div id="status">اضغط على الزر وانطق التعويذة</div>
    
    <button id="mic-btn">🎙️</button>

    <div id="spell-result"></div>

    <script>
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status');
        const resultText = document.getElementById('spell-result');
        
        // التأكد من دعم المتصفح لتقنية التعرف على الصوت
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "عذراً، متصفحك لا يدعم التعرف على الصوت. جرب Google Chrome.";
            micBtn.style.display = 'none';
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US'; // التعاويذ بالإنجليزية
            recognition.interimResults = false;
            
            micBtn.addEventListener('click', () => {
                recognition.start();
                micBtn.classList.add('listening');
                statusText.innerText = "جارِ الاستماع للتعويذة...";
                resultText.innerText = "";
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                resultText.innerText = transcript;
                executeSpell(transcript);
            };

            recognition.onspeechend = () => {
                recognition.stop();
                micBtn.classList.remove('listening');
                statusText.innerText = "اضغط على الزر وانطق التعويذة";
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                statusText.innerText = "لم أتمكن من السماع، حاول مجدداً.";
            };
        }

        function executeSpell(spell) {
            const body = document.body;

            if (spell.includes("lumos")) {
                body.classList.add('lumos-active');
                statusText.innerText = "✨ نور ساطع!";
            } 
            else if (spell.includes("nox")) {
                body.classList.remove('lumos-active');
                statusText.innerText = "🌑 ظلام دامس!";
            }
            else if (spell.includes("expecto patronum")) {
                statusText.innerText = "🦌 استدعاء الباتروناس... جارِ الاتصال بوالدتك!";
                // سيقوم هذا الأمر بفتح تطبيق المكالمات جاهزاً للاتصال
                setTimeout(() => {
                    window.location.href = "tel:Mom";
                }, 1500);
            }
            else if (spell.includes("avada kedavra")) {
                statusText.innerText = "☠️ تعويذة محظورة! سيتم إغلاق الصفحة...";
                setTimeout(() => {
                    window.close(); // قد تمنع بعض المتصفحات هذا الإجراء لدواعي أمنية
                    body.innerHTML = "<h1 style='color:red'>GAME OVER</h1>";
                }, 2000);
            }
            else {
                statusText.innerText = "تعويذة غير معروفة.";
            }
        }
    </script>
</body>
</html>
